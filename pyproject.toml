[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcool-control"
version = "1.2.0"
description = "Native GTK4 app for DeepCool CH-series displays and case lighting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DeepCool Control contributors" }]
keywords = ["deepcool", "ch360", "ch560", "hidraw", "gtk4", "gnome"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = ["psutil>=5.9"]

[project.gui-scripts]
deepcool-control = "deepcool_control.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepcool_control = ["ui/style.css"]
